<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <title>애니 MBTI · 16가지 캐릭터로 보는 나의 성격</title>
    <meta
      name="description"
      content="24개의 질문으로 알아보는 나의 MBTI. 16가지 애니메이션 캐릭터 중 나와 닮은 유형을 찾고 친구와 공유해 보세요."
    />

    <!-- Open Graph (결과 페이지에서 런타임으로 갱신된다) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="애니 MBTI" />
    <meta property="og:title" content="애니 MBTI · 16가지 캐릭터로 보는 나의 성격" />
    <meta
      property="og:description"
      content="24개의 질문으로 알아보는 나의 MBTI. 나와 닮은 애니메이션 캐릭터를 찾아보세요."
    />
    <meta property="og:image" content="/og/default.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="애니 MBTI · 16가지 캐릭터로 보는 나의 성격" />
    <meta
      name="twitter:description"
      content="24개의 질문으로 알아보는 나의 MBTI. 나와 닮은 애니메이션 캐릭터를 찾아보세요."
    />
    <meta name="twitter:image" content="/og/default.png" />

    <!-- 첫 페인트 전에 저장된 테마를 적용해 깜빡임(FOUC)을 막는다 -->
    <script>
      ;(function () {
        try {
          var saved = JSON.parse(localStorage.getItem('anime-mbti:theme'))
          var systemDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches
          var dark =
            saved === 'dark' || ((!saved || saved === 'system') && systemDark)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
